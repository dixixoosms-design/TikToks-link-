<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      max-width: 400px;
      width: 100%;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      word-wrap: break-word;
    }

    .error {
      color: #b00020;
      text-align: left;
      font-size: 13px;
      background: #fff0f0;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Quick Check-In 📍</h1>

  <p>
    Please allow location access to share your current location.
    Your browser will ask for permission before anything is shared.
  </p>

  <button onclick="getLocation()">
    Share My Location
  </button>

  <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ggmzwvddvegazixhyfmf.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_zAQar4i6e-91RqfFirZUpQ_5vVeDTmr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function getLocation() {

  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    result.innerHTML =
      "<p class='error'>Your browser does not support location.</p>";
    return;
  }

  result.innerHTML = "Requesting your location...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);

      result.innerHTML = "Location found. Sending to database...";

      console.log("Latitude:", latitude);
      console.log("Longitude:", longitude);
      console.log("Accuracy:", accuracy);

      const { data, error } = await supabaseClient
        .from("Location")
        .insert({
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy
        })
        .select();

      if (error) {

        console.error("SUPABASE ERROR:", error);

        result.innerHTML = `
          <h3>Database error ❌</h3>

          <div class="error">
            <strong>Error message:</strong><br>
            ${error.message || "Unknown error"}
            <br><br>

            <strong>Error code:</strong><br>
            ${error.code || "No code"}
            <br><br>

            <strong>Details:</strong><br>
            ${error.details || "None"}
            <br><br>

            <strong>Hint:</strong><br>
            ${error.hint || "None"}
          </div>
        `;

        return;
      }

      console.log("SUCCESS:", data);

      const mapsLink =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      result.innerHTML = `
        <h3>Location shared ✅</h3>

        <p>
          Your location has been successfully saved.
        </p>

        <a href="${mapsLink}" target="_blank">
          Open in Google Maps
        </a>
      `;
    },

    function(error) {

      result.innerHTML = `
        <h3>Location permission error ❌</h3>
        <p>
          ${error.message}
        </p>
      `;

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
