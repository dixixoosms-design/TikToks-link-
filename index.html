<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Check-In</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .box {
      background: white;
      max-width: 400px;
      width: 100%;
      padding: 35px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    button {
      background: #111;
      color: white;
      border: 0;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>Quick Check-In 📍</h1>

  <p>
    Please allow location access to share your current location.
    Your browser will ask for permission before anything is shared.
  </p>

  <button onclick="getLocation()">
    Share My Location
  </button>

  <div id="result"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://ggmzwvddvegazixhyfmf.supabase.co";

const SUPABASE_KEY = "sb_publishable_zAQar4i6e-91RqfFirZUpQ_5vVeDTmr";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function getLocation() {

  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    result.innerHTML = "Location isn't supported by this browser.";
    return;
  }

  result.innerHTML = "Requesting your location...";

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = Math.round(position.coords.accuracy);

      const { error } = await supabaseClient
        .from("locations")
        .insert({
          latitude: latitude,
          longitude: longitude,
          accuracy: accuracy
        });

      if (error) {
        console.error(error);
        result.innerHTML = "There was a problem sharing your location. Please try again.";
        return;
      }

      const mapsLink =
        "https://www.google.com/maps?q=" +
        latitude + "," + longitude;

      result.innerHTML = `
        <h3>Location shared ✅</h3>

        <p>
          Your location has been successfully shared.
        </p>

        <a href="${mapsLink}" target="_blank">
          Open in Google Maps
        </a>
      `;
    },

    function(error) {

      result.innerHTML =
        "Location wasn't shared. Please allow location access and try again.";

    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );

}

</script>

</body>
</html>
